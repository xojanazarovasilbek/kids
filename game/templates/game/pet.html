<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uy hayvonlarim</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #fff7d6; margin: 0; padding: 16px; }
    .navbtn { display: inline-block; padding: 8px 16px; margin: 4px; border-radius: 14px;
              background: white; color: #333; text-decoration: none; font-size: 18px;
              box-shadow: 0 2px 6px rgba(0,0,0,.15); }
    #stars { font-size: 22px; margin: 8px 0; }
    .tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 8px 0; }
    .tab { font-size: 30px; padding: 6px 12px; border: 3px solid transparent; border-radius: 16px;
           background: white; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
    .tab.on { border-color: #4f9dff; background: #e8f2ff; }
    .tab small { font-size: 16px; }
    .stage { position: relative; width: 200px; height: 220px; margin: 6px auto 0; }
    .stage .hat { position: absolute; top: 0; left: 0; right: 0; font-size: 60px; z-index: 2; }
    .stage .pet { position: absolute; top: 45px; left: 0; right: 0; font-size: 130px; cursor: pointer; }
    .stage .face { position: absolute; top: 95px; left: 0; right: 0; font-size: 56px; z-index: 2; pointer-events: none; }
    .stage .neck { position: absolute; top: 170px; left: 0; right: 0; font-size: 46px; z-index: 2; pointer-events: none; }
    .bounce { animation: bounce .6s; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-25px); } }
    #bubble { min-height: 30px; font-size: 22px; color: #2c3e50; margin: 4px 0; }
    #name { font-size: 28px; font-weight: bold; }
    #name button { font-size: 18px; border: none; background: none; }
    #mood { font-size: 20px; margin: 4px 0; }
    #barwrap { width: 70%; max-width: 280px; height: 16px; background: #ddd; border-radius: 8px; margin: 6px auto; overflow: hidden; }
    #bar { height: 100%; transition: width .5s; }
    .btn { font-size: 22px; padding: 12px 26px; border: none; border-radius: 16px; background: #2ecc71; color: white; margin: 8px; }
    .box { background: white; max-width: 360px; margin: 12px auto; padding: 14px; border-radius: 20px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .item { border: 3px solid transparent; border-radius: 14px; background: #f4f4f4; padding: 8px; font-size: 15px; }
    .item .e { font-size: 40px; display: block; }
    .item.on { border-color: #2ecc71; background: #eafaf0; }
    .kinds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
    .kind { font-size: 44px; border: 3px solid transparent; border-radius: 16px; background: #f4f4f4; padding: 6px; }
    .kind.sel { border-color: #4f9dff; background: #e8f2ff; }
    input { font-size: 20px; padding: 8px; width: 80%; text-align: center; border-radius: 10px; border: 2px solid #ccc; }
    #toast { min-height: 26px; font-size: 18px; color: #c0392b; }
  </style>
</head>
<body>
  {% csrf_token %}
  <a class="navbtn" href="/">🏠 Menyu</a>
  <div id="stars"></div>
  <div id="app"></div>

  {{ state|json_script:"state-data" }}
  <script>
    let S = JSON.parse(document.getElementById("state-data").textContent);
    const CSRF = document.querySelector("[name=csrfmiddlewaretoken]").value;
    const $ = id => document.getElementById(id);
    const el = (tag, cls, text) => {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    };
    let view = S.pet ? "pet" : "adopt";
    let chosenKind = null, toast = "", bubbleText = "";

    function speak(word) {
      const u = new SpeechSynthesisUtterance(word);
      u.lang = S.speech; u.rate = 0.85;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }
    const moodIcon = f => f < 30 ? "😢" : (f < 60 ? "🙂" : "😊");
    const itemOf = id => S.shop.find(s => s.id === id);

    async function act(body) {
      try {
        const r = await fetch("/api/pet/", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-CSRFToken": CSRF },
          body: JSON.stringify(body),
        });
        if (!r.ok) throw new Error("bad");
        S = await r.json();
        toast = S.error || "";
        if (!S.error && (body.action === "adopt" || body.action === "switch")) {
          view = "pet";
          chosenKind = null;
          bubbleText = "";
        }
      } catch (e) {
        toast = "Aloqa xatosi. Sahifani yangilang.";
      }
      render();
    }

    function renderTabs(app) {
      const tabs = el("div", "tabs");
      S.pets.forEach(x => {
        const on = view === "pet" && S.pet && S.pet.id === x.id;
        const b = el("button", "tab" + (on ? " on" : ""), x.kind);
        b.append(el("small", "", moodIcon(x.fullness)));
        b.onclick = () => act({ action: "switch", id: x.id });
        tabs.append(b);
      });
      if (S.pets.length < S.max_pets) {
        const add = el("button", "tab" + (view === "adopt" ? " on" : ""), "➕");
        add.onclick = () => { view = "adopt"; toast = ""; render(); };
        tabs.append(add);
      }
      app.append(tabs);
    }

    function renderAdopt(app) {
      const cost = S.adopt_cost;
      app.append(el("h2", "", S.pets.length ? "Yangi do'st topamiz! 🐾" : "O'z hayvoningni tanla! 🐣"));
      const box = el("div", "box");
      const kinds = el("div", "kinds");
      S.kinds.forEach(k => {
        const b = el("button", "kind" + (chosenKind === k ? " sel" : ""), k);
        b.onclick = () => { chosenKind = k; render(); };
        kinds.append(b);
      });
      const inp = el("input");
      inp.id = "petname";
      inp.placeholder = "Ismini yoz";
      inp.maxLength = 20;
      const go = el("button", "btn", cost ? "Asrab olish (" + cost + " ⭐)" : "Boshlash!");
      go.onclick = () => act({ action: "adopt", kind: chosenKind, name: $("petname").value });
      box.append(kinds, inp, el("br"), go);
      app.append(box);
    }

    function renderPet(app) {
      const P = S.pet;
      const eq = P.equipped || {};
      const stage = el("div", "stage");
      ["hat", "face", "neck"].forEach(slot => {
        const it = eq[slot] && itemOf(eq[slot]);
        if (it) stage.append(el("div", slot, it.emoji));
      });
      const pet = el("div", "pet", P.kind);
      const bubble = el("div"); bubble.id = "bubble"; bubble.textContent = bubbleText;
      pet.onclick = () => {
        pet.classList.remove("bounce");
        void pet.offsetWidth;
        pet.classList.add("bounce");
        if (S.words.length) {
          const w = S.words[Math.floor(Math.random() * S.words.length)];
          bubbleText = "💬 " + w.en + " = " + w.uz;
          bubble.textContent = bubbleText;
          speak(w.en);
        }
      };
      stage.append(pet);

      let mood = "😊 Xursand!", color = "#2ecc71";
      if (P.fullness < 30) { mood = "😢 Qorni ochdi..."; color = "#e74c3c"; }
      else if (P.fullness < 60) { mood = "🙂 Yaxshi"; color = "#f1c40f"; }
      if (P.fullness === 0) mood = "😭 Juda och!";

      const nameRow = el("div"); nameRow.id = "name";
      nameRow.append(document.createTextNode(P.name + " "));
      const ren = el("button", "", "✏️");
      ren.onclick = () => {
        const n = prompt("Yangi ism:", P.name);
        if (n && n.trim()) act({ action: "rename", name: n });
      };
      nameRow.append(ren);

      const moodEl = el("div", "", mood); moodEl.id = "mood";
      const barwrap = el("div"); barwrap.id = "barwrap";
      const bar = el("div"); bar.id = "bar";
      bar.style.width = P.fullness + "%";
      bar.style.background = color;
      barwrap.append(bar);

      const feed = el("button", "btn", "🍖 Boqish (2 ⭐)");
      feed.onclick = () => act({ action: "feed" });

      app.append(stage, bubble, nameRow, moodEl, barwrap, feed,
                 el("div", "", "👆 Hayvonni bossang, so'z o'rgatadi!"));

      const shop = el("div", "box");
      shop.append(el("h3", "", "🛍 Do'kon"));
      const grid = el("div", "grid");
      S.shop.forEach(it => {
        const owned = P.items.includes(it.id);
        const on = eq[it.slot] === it.id;
        const b = el("button", "item" + (on ? " on" : ""));
        b.append(el("span", "e", it.emoji), document.createTextNode(it.name), el("br"),
                 document.createTextNode(owned ? (on ? "✅ Kiyilgan" : "Kiyish") : it.price + " ⭐"));
        b.onclick = () => act({ action: owned ? "equip" : "buy", id: it.id });
        grid.append(b);
      });
      shop.append(grid);
      app.append(shop);
    }

    function render() {
      $("stars").textContent = "⭐ Sarflash uchun: " + S.stars;
      const app = $("app");
      app.innerHTML = "";
      if (S.pets.length) renderTabs(app);
      if (view === "adopt" || !S.pet) renderAdopt(app); else renderPet(app);
      const t = el("div"); t.id = "toast"; t.textContent = toast;
      app.append(t);
    }
    render();
  </script>
</body>
</html>
