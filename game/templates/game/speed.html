<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tez javob</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #fff7d6; margin: 0; padding: 16px; }
    .navbtn { display: inline-block; padding: 8px 16px; margin: 4px; border-radius: 14px;
              background: white; color: #333; text-decoration: none; font-size: 18px;
              box-shadow: 0 2px 6px rgba(0,0,0,.15); border: none; cursor: pointer; }
    #info { font-size: 24px; margin: 8px 0; }
    #barwrap { width: 80%; max-width: 320px; height: 14px; background: #ddd; border-radius: 7px; margin: 6px auto; overflow: hidden; }
    #bar { height: 100%; width: 100%; background: #e67e22; transition: width 1s linear; }
    .pic { font-size: 100px; margin: 14px 0 4px; }
    .btn { display: block; width: 80%; max-width: 320px; margin: 10px auto; padding: 14px;
           font-size: 24px; border: none; border-radius: 16px; background: #4f9dff; color: white; }
    .btn.ok { background: #2ecc71; }
    .btn.no { background: #e74c3c; }
    .big { font-size: 64px; }
    .box { background: white; max-width: 320px; margin: 14px auto; padding: 20px; border-radius: 20px; font-size: 22px; }
    .start { font-size: 26px; padding: 14px 36px; border: none; border-radius: 16px; background: #2ecc71; color: white; margin-top: 10px; }
    .conf { position: fixed; top: -40px; pointer-events: none; z-index: 99; animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
  </style>
</head>
<body>
  {% csrf_token %}
  <a class="navbtn" href="/">🏠 Menyu</a>
  <div id="info"></div>
  <div id="barwrap"><div id="bar"></div></div>
  <div id="game"></div>

  {{ words|json_script:"words-data" }}
  <script>
    const WORDS = JSON.parse(document.getElementById("words-data").textContent);
    const CSRF = document.querySelector("[name=csrfmiddlewaretoken]").value;
    const BEST = {{ best }};
    const TOTAL = 30;
    const $ = id => document.getElementById(id);
    const shuffle = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(p => p[1]);
    const sample = (a, n) => shuffle(a).slice(0, n);
    const el = (tag, cls, text) => {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    };

    let actx;
    function tone(freq, start, dur, type, vol) {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "sine";
      o.frequency.value = freq;
      const t = actx.currentTime + start;
      g.gain.setValueAtTime(vol || 0.2, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + dur);
    }
    function sound(kind) {
      try {
        if (kind === "good") { tone(660, 0, .1); tone(880, .08, .15); }
        else if (kind === "bad") { tone(260, 0, .2, "triangle", .12); }
        else if (kind === "end") { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .12, .3)); }
      } catch (e) {}
    }
    function confetti(n) {
      const em = ["⭐", "🎉", "✨", "🎈", "💛"];
      for (let i = 0; i < n; i++) {
        const s = document.createElement("span");
        s.className = "conf";
        s.textContent = em[Math.floor(Math.random() * em.length)];
        s.style.left = Math.random() * 100 + "vw";
        s.style.animationDuration = (1.5 + Math.random() * 1.5) + "s";
        s.style.fontSize = (20 + Math.random() * 20) + "px";
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 3200);
      }
    }
    function speak(word) {
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "{{ speech }}"; u.rate = 0.9;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }

    let score = 0, left = TOTAL, timer = null, locked = false;

    function intro() {
      const g = $("game");
      g.innerHTML = "";
      $("info").textContent = "";
      $("bar").style.width = "100%";
      const box = el("div", "box");
      box.append(
        el("div", "big", "⏱"),
        el("div", "", "30 soniyada nechta so'z topa olasiz?"),
        el("div", "", "🏆 Rekord: " + BEST)
      );
      const b = el("button", "start", "Boshlash!");
      b.onclick = start;
      g.append(box, b);
    }

    function start() {
      score = 0; left = TOTAL; locked = false;
      updateInfo();
      $("bar").style.width = "100%";
      question();
      timer = setInterval(() => {
        left--;
        updateInfo();
        $("bar").style.width = (left / TOTAL * 100) + "%";
        if (left <= 0) finish();
      }, 1000);
    }

    function updateInfo() {
      $("info").textContent = "⏱ " + left + "  ·  ✅ " + score;
    }

    function question() {
      locked = false;
      const w = sample(WORDS, 1)[0];
      const others = [];
      const seen = new Set([w.en]);
      shuffle(WORDS).forEach(x => {
        if (others.length < 3 && !seen.has(x.en)) { seen.add(x.en); others.push(x); }
      });
      const opts = shuffle([w, ...others]);
      const g = $("game");
      g.innerHTML = "";
      g.append(el("div", "pic", w.emoji));
      opts.forEach(o => {
        const b = el("button", "btn", o.en);
        b.onclick = () => {
          if (locked || left <= 0) return;
          locked = true;
          if (o.en === w.en) {
            score++; sound("good"); b.classList.add("ok");
          } else {
            sound("bad"); b.classList.add("no");
          }
          updateInfo();
          setTimeout(() => { if (left > 0) question(); }, 250);
        };
        g.append(b);
      });
    }

    async function finish() {
      clearInterval(timer);
      locked = true;
      sound("end");
      const g = $("game");
      g.innerHTML = "";
      $("info").textContent = "⏰ Vaqt tugadi!";
      const box = el("div", "box", "Saqlanmoqda...");
      g.append(box);
      try {
        const r = await fetch("/api/speed/", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-CSRFToken": CSRF },
          body: JSON.stringify({ count: score }),
        });
        if (!r.ok) throw new Error("bad");
        const d = await r.json();
        box.innerHTML = "";
        box.append(
          el("div", "big", d.record && score > 0 ? "🏆" : "🎉"),
          el("div", "", "Natija: " + score + " ta so'z"),
          el("div", "", "+" + d.gained + " ⭐"),
          el("div", "", "Rekord: " + d.best)
        );
        if (d.record && score > 0) {
          box.append(el("div", "", "Yangi rekord! 🎊"));
          confetti(60);
        }
        if (d.sticker) {
          box.append(el("div", "", "🎁 Yangi stiker: " + d.sticker.emoji + " " + d.sticker.name));
        }
        const again = el("button", "start", "Yana o'ynash");
        again.onclick = () => location.reload();
        g.append(again);
      } catch (e) {
        box.textContent = "Aloqa xatosi. Sahifani yangilang.";
      }
    }

    intro();
  </script>
    {% include "game/timer.html" %}
</body>
</html>
